project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - research.qmd
    - teaching.qmd
    - resources.qmd
    - icpsr-2026/index.qmd
    - posc-3710/index.qmd
    - posc-8410/index.qmd
  resources:
    - google6306c6a89f6a4388.html
    - posc-3710/*.pdf
    - posc-3710/*.pptx
    - posc-8410/*.pdf
    - posc-8410/*.pptx
    # Reveal.js decks are not self-contained: the .html is a shell that loads
    # reveal.js/theme/plugins from site_libs, its plots from <deck>_files, and
    # its pictures from images. All four must ship or the deck renders unstyled.
    - posc-8410/*.html
    - posc-8410/*_files/**
    - posc-8410/site_libs/**
    - posc-8410/images/**
    - icpsr-2026/*.html
    - icpsr-2026/*_files/**
    - icpsr-2026/Slides_Images/**
    - icpsr-2026/exercises/*.html
    - icpsr-2026/exercises/*_files/**

website:
  title: "Will Horne"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - research.qmd
      - teaching.qmd
      - resources.qmd
  page-footer:
    center: "© {2026} Will Horne"
  site-url: "https://will-horne.github.io/"

format:
  html:
    theme: cosmo
    toc: true
    smooth-scroll: true
    link-external-newwindow: true
